<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dart Tournament Hub{% endblock %}</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #101512;
            --surface: #1a211d;
            --border: #334039;
            --text: #f1f5f2;
            --muted: #aab7af;
            --accent: #55d98b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background: var(--background);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
        }

        a { color: inherit; }

        .site-header {
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .container {
            width: min(1100px, calc(100% - 2rem));
            margin-inline: auto;
        }

        .site-header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 4.5rem;
        }

        .brand {
            color: var(--accent);
            font-size: 1.25rem;
            font-weight: 800;
            text-decoration: none;
        }

        nav a {
            color: var(--muted);
            text-decoration: none;
        }

        main { padding-block: 3rem; }

        footer {
            padding-block: 2rem;
            color: var(--muted);
            text-align: center;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="{% url 'tournaments:list' %}">Dart Tournament Hub</a>
            <nav aria-label="Główna nawigacja">
                <a href="{% url 'tournaments:list' %}">Turnieje</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">Obsługa turniejów i meczów darta</div>
    </footer>
</body>
</html>
